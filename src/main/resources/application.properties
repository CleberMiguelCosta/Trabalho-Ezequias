spring.application.name=biblioteca-crud

# Banco H2 em arquivo. Os livros permanecem depois de encerrar a aplicação.
spring.datasource.generate-unique-name=false
spring.datasource.url=jdbc:h2:file:./data/biblioteca;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Console: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/biblioteca
# Usuário: sa
# Senha: (vazia)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

server.port=8080
server.error.include-message=never
server.error.include-binding-errors=never

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Amazon Product Advertising API (opcional). Sem credenciais, a busca segue só com Google Books e Open Library.
# Crie uma conta de afiliado Amazon e preencha as variáveis abaixo ou exporte AMAZON_PAAPI_*.
amazon.paapi.access-key=${AMAZON_PAAPI_ACCESS_KEY:}
amazon.paapi.secret-key=${AMAZON_PAAPI_SECRET_KEY:}
amazon.paapi.partner-tag=${AMAZON_PAAPI_PARTNER_TAG:}
amazon.paapi.host=webservices.amazon.com.br
amazon.paapi.region=us-east-1
amazon.paapi.marketplace=www.amazon.com.br
